<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>VR Camera Sync</title>

<!-- A-FRAME -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<!-- EXTRAS -->
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

body {
    margin: 0;
    overflow: hidden;
}

</style>

<script>

// =====================================================
// FIREBASE
// =====================================================

const firebaseConfig = {

    apiKey: "AIzaSyCDxYWfc8VOD5DFLq-JA8C0svyKY3L_-Q8",
    authDomain: "simbioze-d7472.firebaseapp.com",
    databaseURL: "https://simbioze-d7472-default-rtdb.firebaseio.com/",
    projectId: "simbioze-d7472",
    storageBucket: "simbioze-d7472.firebasestorage.app",
    messagingSenderId: "131554241238",
    appId: "1:131554241238:web:7c02e6e03b1d72e0d23777",
    measurementId: "G-JNE6LP2H9E"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

window.addEventListener("beforeunload", () => {

    db.ref("camera").remove();

});


// =====================================================
// ENVIRONMENT MAP (reflections + PBR fill)
// =====================================================

AFRAME.registerComponent('env-map', {

    init() {

        const sceneEl = this.el;
        const threeScene = sceneEl.object3D;

        const apply = () => {

            const renderer = sceneEl.renderer;
            const pmrem = new THREE.PMREMGenerator(renderer);
            pmrem.compileCubemapShader();

            // Build a minimal neutral environment manually.
            // Six box faces with different soft colors —
            // enough to give PBR materials sky/ground/wall tints.

            const envScene = new THREE.Scene();

            const boxGeo = new THREE.BoxGeometry(10, 10, 10);

            const materials = [
                new THREE.MeshBasicMaterial({ color: 0xc4bde0, side: THREE.BackSide }), // right
                new THREE.MeshBasicMaterial({ color: 0xb8b0d8, side: THREE.BackSide }), // left
                new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.BackSide }), // top
                new THREE.MeshBasicMaterial({ color: 0x4a4060, side: THREE.BackSide }), // bottom
                new THREE.MeshBasicMaterial({ color: 0xd0caec, side: THREE.BackSide }), // front
                new THREE.MeshBasicMaterial({ color: 0xa89ecc, side: THREE.BackSide }), // back
            ];

            const envBox = new THREE.Mesh(boxGeo, materials);
            envScene.add(envBox);

            const envTex = pmrem.fromScene(envScene, 0.04).texture;
            threeScene.environment = envTex;

            pmrem.dispose();
            envScene.clear();

        };

        if (sceneEl.hasLoaded && sceneEl.renderer) {
            apply();
        } else {
            sceneEl.addEventListener('loaded', apply);
        }

    }

});


// =====================================================
// SCENE FOG (exponential depth haze)
// =====================================================

AFRAME.registerComponent('scene-fog', {

    schema: {
        color:   { type: 'color',  default: '#060606' },
        density: { type: 'number', default: 0.05 }
    },

    init() {

        const apply = () => {

            this.el.object3D.fog = new THREE.FogExp2(
                this.data.color,
                this.data.density
            );

        };

        if (this.el.hasLoaded) {
            apply();
        } else {
            this.el.addEventListener('loaded', apply);
        }

    }

});


// =====================================================
// ORGANIC DISTORTION
// =====================================================

AFRAME.registerComponent('organic-distortion', {

    init() {

        this.el.addEventListener('model-loaded', () => {

            const mesh = this.el.getObject3D('mesh');

            if (!mesh) return;

            mesh.traverse((node) => {

                // ignore skinned meshes

                if (node.isMesh && !node.isSkinnedMesh) {

                    // shadows on static meshes

                    node.castShadow = true;
                    node.receiveShadow = true;

                    const geometry = node.geometry;
                    const position = geometry.attributes.position;

                    const originalPositions = [];

                    for (let i = 0; i < position.count; i++) {

                        originalPositions.push({

                            x: position.getX(i),
                            y: position.getY(i),
                            z: position.getZ(i)

                        });

                    }

                    node.userData.originalPositions =
                        originalPositions;

                }

                // skinned meshes still get shadows,
                // but no vertex displacement

                if (node.isSkinnedMesh) {

                    node.castShadow = true;
                    node.receiveShadow = true;

                }

            });

        });

    },

    tick(time) {

        const mesh = this.el.getObject3D('mesh');

        if (!mesh) return;

        const t = time * 0.001;

        mesh.traverse((node) => {

            // IMPORTANT:
            // skip skinned meshes entirely here.
            // recomputing normals on skinned meshes
            // breaks their lighting.

            if (node.isMesh && !node.isSkinnedMesh) {

                const position =
                    node.geometry.attributes.position;

                const original =
                    node.userData.originalPositions;

                if (!original) return;

                for (let i = 0; i < position.count; i++) {

                    const ox = original[i].x;
                    const oy = original[i].y;
                    const oz = original[i].z;

                    const wave1 =
                        Math.sin(t * 2.0 + ox * 3.0 + oy * 2.0) * 0.06;

                    const wave2 =
                        Math.cos(t * 1.5 + oy * 6.0 + oz * 2.0) * 0.04;

                    const noise =
                        Math.sin(t * 5.0 + ox * 15.0 + oy * 12.0) * 0.01;

                    const pulse =
                        Math.sin(t * 0.8) * 0.03;

                    const distortion =
                        wave1 + wave2 + noise + pulse;

                    position.setXYZ(

                        i,

                        ox + distortion * 0.3,
                        oy + distortion * 0.15,
                        oz + distortion

                    );

                }

                position.needsUpdate = true;
                node.geometry.computeVertexNormals();
            }

        });

    }

});


// =====================================================
// CAMERA SENDER
// =====================================================

AFRAME.registerComponent('camera-sync', {

    tick: function (time) {

        if (!this.lastUpdate) {
            this.lastUpdate = 0;
        }

        if (time - this.lastUpdate < 50) return;

        this.lastUpdate = time;

        const pos = this.el.object3D.position;
        const rot = this.el.object3D.rotation;

        db.ref("camera").set({

            px: pos.x,
            py: pos.y,
            pz: pos.z,

            rx: rot.x,
            ry: rot.y,
            rz: rot.z

        });

    }

});


// =====================================================
// CAMERA VIEWER
// =====================================================

AFRAME.registerComponent('camera-viewer', {

    init: function () {

        const el = this.el;

        db.ref("camera").on("value", (snapshot) => {

            const data = snapshot.val();

            if (!data) return;

            el.object3D.position.set(
                data.px,
                data.py,
                data.pz
            );

            el.object3D.rotation.set(
                data.rx,
                data.ry,
                data.rz
            );

        });

    }

});

</script>

</head>

<body>

<a-scene

background="color: #ffffff"

renderer="colorManagement: true;
          physicallyCorrectLights: true;
          toneMapping: ACESFilmic;
          exposure: 1.0;
          shadowMap.enabled: true;
          shadowMap.type: PCFSoft;
          antialias: true"

env-map
scene-fog="color: #DA9FF9; density: 0.04"

inspector
keyboard-shortcuts
screenshot
xr-mode-ui
device-orientation-permission-ui>

<!-- =====================================================
ASSETS
===================================================== -->

<a-assets>

<a-asset-item
    id="sceneModel"
    src="https://popova-veronika.github.io/simbioze_opt.glb">
</a-asset-item>

</a-assets>


<!-- =====================================================
CAMERA
===================================================== -->

<a-entity
    id="mainCamera"
    camera
    position="0 1.6 5">
</a-entity>


<!-- =====================================================
LIGHTS
===================================================== -->

<a-entity
    light="type: ambient;
           intensity: 0.6;
           color: #ffffff">
</a-entity>
  
  <a-entity 
    id="keyLight" 
    light="intensity: 2.49; 
          color: #ffe0ee; 
          castShadow: true; 
          shadowMapWidth: 2048;
          shadowMapHeight: 2023.41; 
          shadowCameraLeft: -29.6; 
          shadowCameraRight: 8.65; 
          shadowCameraTop: 11.59; 
          shadowCameraBottom: -6.14; 
          shadowCameraNear: 0.12; 
          shadowCameraFar: 30.01; 
          shadowBias: -0.001; 
          shadowRadius: 4.02; 
          shadowCameraFov: 90.09" 
            position="-0.07331 4.5404 0.03509" 
            scale="2 2 2" 
            visible="">
</a-entity>

<a-entity
    light="type: point;
           color: #796d7e;
           intensity: 8;
           distance: 3;
           decay: 2"
    position="-0.05479 4.37636 -1.47918">
</a-entity>


<!-- =====================================================
MODEL
===================================================== -->

<a-entity
    gltf-model="#sceneModel"
    position="1.20087 0 -2.79553"
    animation-mixer
    organic-distortion
    shadow="cast: true; receive: true">
</a-entity>


</a-scene>


<!-- =====================================================
MODE SETUP
===================================================== -->

<script>

window.addEventListener("DOMContentLoaded", () => {

    const params = new URLSearchParams(window.location.search);

    const mode = params.get("mode");

    const cam = document.querySelector("#mainCamera");

    // ==========================================
    // VR USER
    // ==========================================

    if (mode === "vr") {

        cam.setAttribute("look-controls", "");
        cam.setAttribute("wasd-controls", "");
        cam.setAttribute("camera-sync", "");

        console.log("VR MODE");

    }

    // ==========================================
    // VIEWER
    // ==========================================

    else {

        cam.setAttribute("camera-viewer", "");

        console.log("VIEW MODE");

    }

});

</script>

</body>
</html>
