<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VR Camera Sync</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<style>
body {
    margin: 0;
    overflow: hidden;
}
</style>

</head>

<body>

<script>

// ===============================
// CAMERA SENDER
// ===============================

AFRAME.registerComponent('camera-sync', {

    tick: function () {

        const pos = this.el.object3D.position;
        const rot = this.el.object3D.rotation;

        localStorage.setItem('camPos', JSON.stringify({
            x: pos.x,
            y: pos.y,
            z: pos.z
        }));

        localStorage.setItem('camRot', JSON.stringify({
            x: rot.x,
            y: rot.y,
            z: rot.z
        }));

    }

});

// ===============================
// CAMERA VIEWER
// ===============================

AFRAME.registerComponent('camera-viewer', {

    tick: function () {

        const pos = JSON.parse(localStorage.getItem('camPos'));
        const rot = JSON.parse(localStorage.getItem('camRot'));

        if (!pos || !rot) return;

        this.el.object3D.position.set(
            pos.x,
            pos.y,
            pos.z
        );

        this.el.object3D.rotation.set(
            rot.x,
            rot.y,
            rot.z
        );

    }

});

</script>

<a-scene background="color: #ffffff">

<!-- ===============================
ASSETS
=============================== -->

<a-assets>

    <a-asset-item
        id="sceneModel"
        src="https://popova-veronika.github.io/DIPLOM_TEST.glb">
    </a-asset-item>

</a-assets>

<!-- ===============================
WORLD
=============================== -->

<a-entity
    gltf-model="#sceneModel"
    position="1.20087 0 -2.79553"
    animation-mixer>
</a-entity>

<!-- ===============================
LIGHTS
=============================== -->

<a-entity
    light="type: ambient; intensity: 0.46; color: #ffffff">
</a-entity>

<a-entity
    light="type: point; color: #767aea; intensity: 2; distance: 6.47"
    position="-14.70362 5.05623 -23.46842">
</a-entity>

<a-entity
    light="type: point; color: #4719b3; intensity: 5.39; distance: 5.61"
    position="-16.30642 3.94849 -11.62215">
</a-entity>

<a-entity
    light="type: point; color: #ff4fd8; intensity: 2; distance: 5.67"
    position="-13.6727 2.60813 -0.2093">
</a-entity>

<a-entity
    light="type: point; color: #4f7dff; intensity: 2"
    position="2.62043 1.10844 -20.78345">
</a-entity>

<!-- ===============================
MODE SWITCH
=============================== -->

<script>

const params = new URLSearchParams(window.location.search);

const mode = params.get("mode");

// ===============================
// VR USER
// ===============================

if (mode === "vr") {

    document.write(`

        <a-entity
            id="cameraRig">

            <a-entity
                id="mainCamera"
                camera
                look-controls
                wasd-controls
                position="0 1.6 0"
                camera-sync>
            </a-entity>

        </a-entity>

    `);

}

// ===============================
// VIEWER
// ===============================

else {

    document.write(`

        <a-entity
            id="viewerCamera"
            camera
            position="0 1.6 0"
            camera-viewer>
        </a-entity>

    `);

}

</script>

</a-scene>

</body>
</html>
