<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>Atmospheric VR Scene</title>

<!-- A-FRAME -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<!-- EXTRAS -->
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

<!-- BLOOM / POSTPROCESS -->
<script src="https://unpkg.com/aframe-effects@1.0.0/dist/aframe-effects.min.js"></script>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

body {
    margin: 0;
    overflow: hidden;
    background: black;
}

</style>

<script>

// =====================================================
// FIREBASE
// =====================================================

const firebaseConfig = {

    apiKey: "AIzaSyCDxYWfc8VOD5DFLq-JA8C0svyKY3L_-Q8",
    authDomain: "simbioze-d7472.firebaseapp.com",
    databaseURL: "https://simbioze-d7472-default-rtdb.firebaseio.com/",
    projectId: "simbioze-d7472",
    storageBucket: "simbioze-d7472.firebasestorage.app",
    messagingSenderId: "131554241238",
    appId: "1:131554241238:web:7c02e6e03b1d72e0d23777",
    measurementId: "G-JNE6LP2H9E"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

window.addEventListener("beforeunload", () => {

    db.ref("camera").remove();

});

// =====================================================
// ORGANIC DISTORTION
// =====================================================

AFRAME.registerComponent('organic-distortion', {

    init() {

        this.el.addEventListener('model-loaded', () => {

            const mesh = this.el.getObject3D('mesh');

            if (!mesh) return;

            mesh.traverse((node) => {

                if (node.isMesh && !node.isSkinnedMesh) {

                    const geometry = node.geometry;
                    const position = geometry.attributes.position;

                    const originalPositions = [];

                    for (let i = 0; i < position.count; i++) {

                        originalPositions.push({

                            x: position.getX(i),
                            y: position.getY(i),
                            z: position.getZ(i)

                        });

                    }

                    node.userData.originalPositions =
                        originalPositions;

                    node.castShadow = true;
                    node.receiveShadow = true;

                }

            });

        });

    },

    tick(time) {

        const mesh = this.el.getObject3D('mesh');

        if (!mesh) return;

        const t = time * 0.001;

        mesh.traverse((node) => {

            if (node.isMesh) {

                const position =
                    node.geometry.attributes.position;

                const original =
                    node.userData.originalPositions;

                if (!original) return;

                for (let i = 0; i < position.count; i++) {

                    const ox = original[i].x;
                    const oy = original[i].y;
                    const oz = original[i].z;

                    const wave1 =

                        Math.sin(
                            t * 2.0 +
                            ox * 3.0 +
                            oy * 2.0
                        ) * 0.05;

                    const wave2 =

                        Math.cos(
                            t * 1.5 +
                            oy * 6.0 +
                            oz * 2.0
                        ) * 0.03;

                    const noise =

                        Math.sin(
                            t * 5.0 +
                            ox * 15.0 +
                            oy * 12.0
                        ) * 0.008;

                    const pulse =

                        Math.sin(
                            t * 0.8
                        ) * 0.02;

                    const distortion =
                        wave1 +
                        wave2 +
                        noise +
                        pulse;

                    position.setXYZ(

                        i,

                        ox + distortion * 0.18,
                        oy + distortion * 0.08,
                        oz + distortion * 0.4

                    );

                }

                position.needsUpdate = true;

                // KEEP THIS
                // lighting needs normals

                node.geometry.computeVertexNormals();

            }

        });

    }

});

// =====================================================
// FLOATING PARTICLES
// =====================================================

AFRAME.registerComponent('floating-particles', {

    init() {

        const count = 180;

        for (let i = 0; i < count; i++) {

            const particle = document.createElement('a-sphere');

            const x = (Math.random() - 0.5) * 20;
            const y = Math.random() * 8;
            const z = (Math.random() - 0.5) * 20;

            const scale =
                Math.random() * 0.03 + 0.01;

            const opacity =
                Math.random() * 0.08 + 0.02;

            particle.setAttribute('position', `${x} ${y} ${z}`);

            particle.setAttribute('radius', scale);

            particle.setAttribute('material', `
                color: #d7dcff;
                emissive: #d7dcff;
                emissiveIntensity: 1;
                transparent: true;
                opacity: ${opacity};
                shader: flat;
            `);

            particle.setAttribute('animation', `
                property: position;
                to: ${x} ${y + Math.random() * 1.5} ${z};
                dir: alternate;
                dur: ${4000 + Math.random() * 6000};
                loop: true;
                easing: easeInOutSine;
            `);

            this.el.appendChild(particle);

        }

    }

});

// =====================================================
// CAMERA SENDER
// =====================================================

AFRAME.registerComponent('camera-sync', {

    tick: function (time) {

        if (!this.lastUpdate) {
            this.lastUpdate = 0;
        }

        if (time - this.lastUpdate < 50) return;

        this.lastUpdate = time;

        const pos = this.el.object3D.position;
        const rot = this.el.object3D.rotation;

        db.ref("camera").set({

            px: pos.x,
            py: pos.y,
            pz: pos.z,

            rx: rot.x,
            ry: rot.y,
            rz: rot.z

        });

    }

});

// =====================================================
// CAMERA VIEWER
// =====================================================

AFRAME.registerComponent('camera-viewer', {

    init: function () {

        const el = this.el;

        db.ref("camera").on("value", (snapshot) => {

            const data = snapshot.val();

            if (!data) return;

            el.object3D.position.set(
                data.px,
                data.py,
                data.pz
            );

            el.object3D.rotation.set(
                data.rx,
                data.ry,
                data.rz
            );

        });

    }

});

</script>

</head>

<body>

<a-scene

background="color: #0b0e14"

fog="
    type: exponential;
    color: #0b0e14;
    density: 0.018"

renderer="
    colorManagement: true;
    physicallyCorrectLights: false;
    toneMapping: ACESFilmic;
    exposure: 1.15;
    sortObjects: true"

shadow="type: pcfsoft"

effects="
    bloom: true;
    bloomIntensity: 0.65;
    bloomThreshold: 0.72;
    bloomRadius: 0.85"

floating-particles

inspector
keyboard-shortcuts
screenshot
xr-mode-ui
device-orientation-permission-ui>

<!-- =====================================================
ASSETS
===================================================== -->

<a-assets>

<a-asset-item
    id="sceneModel"
    src="https://popova-veronika.github.io/simbioze_opt.glb">
</a-asset-item>

</a-assets>

<!-- =====================================================
CAMERA
===================================================== -->

<a-entity
    id="mainCamera"
    camera
    position="0 1.6 5">
</a-entity>

<!-- =====================================================
LIGHTS
===================================================== -->

<!-- AMBIENT -->

<a-entity
light="
    type: ambient;
    intensity: 0.18;
    color: #55607d">
</a-entity>

<!-- MAIN BLUE LIGHT -->

<a-entity
light="
    type: directional;
    color: #bfcfff;
    intensity: 1.8;
    castShadow: true;
    shadowMapWidth: 2048;
    shadowMapHeight: 2048"
position="2 6 3">
</a-entity>

<!-- PURPLE ATMOSPHERIC LIGHT -->

<a-entity
light="
    type: point;
    color: #9078ff;
    intensity: 9;
    distance: 14;
    decay: 1.4"
position="-0.05 4.3 -1.4">
</a-entity>

<!-- WARM CONTRAST LIGHT -->

<a-entity
light="
    type: point;
    color: #ffb38f;
    intensity: 3;
    distance: 6;
    decay: 2"
position="2 1 -4">
</a-entity>

<!-- SOFT GLOW SPHERE -->

<a-sphere
position="-0.05 4.3 -1.4"
radius="1.8"
material="
    color: #9078ff;
    emissive: #9078ff;
    emissiveIntensity: 2;
    transparent: true;
    opacity: 0.05;
    shader: flat">
</a-sphere>

<!-- =====================================================
MODEL
===================================================== -->

<a-entity
    gltf-model="#sceneModel"
    position="1.20087 0 -2.79553"
    animation-mixer
    organic-distortion>
</a-entity>

</a-scene>

<!-- =====================================================
MODE SETUP
===================================================== -->

<script>

window.addEventListener("DOMContentLoaded", () => {

    const params = new URLSearchParams(window.location.search);

    const mode = params.get("mode");

    const cam = document.querySelector("#mainCamera");

    if (mode === "vr") {

        cam.setAttribute("look-controls", "");
        cam.setAttribute("wasd-controls", "");
        cam.setAttribute("camera-sync", "");

        console.log("VR MODE");

    }

    else {

        cam.setAttribute("camera-viewer", "");

        console.log("VIEW MODE");

    }

});

</script>

</body>
</html>
